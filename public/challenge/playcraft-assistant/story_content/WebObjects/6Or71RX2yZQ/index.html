<!DOCTYPE html>
<html>
<head>
  <style>body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }</style>

<script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.81/build/spline-viewer.js"></script>
</head>
<body>
  
<spline-viewer id="mi-robot" url="https://prod.spline.design/vHseAP5MDCnKVMMv/scene.splinecode"></spline-viewer>

<script>
  const viewer = document.getElementById('mi-robot');
  let motor = null;

  viewer.addEventListener('load-complete', (e) => {
      motor = viewer._spline || viewer.spline || e.detail;
  });

  // El traductor escuchando a tus 3 botones
  window.addEventListener('message', (event) => {
      if (motor && typeof motor.setVariable === 'function') {
          // Cambiamos el número de la variable correspondiente a 1 (o al número que active tu animación)
          if (event.data === 'ACTIVAR_SALUDO') motor.setVariable('Saludo', 1);
          if (event.data === 'ACTIVAR_LOADING') motor.setVariable('Loading', 1);
          if (event.data === 'ACTIVAR_YES') motor.setVariable('Yes', 1);
      }
  });
</script>

</body>
</html>
